# Local development only. Credentials are fixed and never used outside this machine.
# Ports avoid 5432 (host Postgres) and 5433/5434 (fpp_board_backend).
name: gc-orders

services:
  postgres:
    image: postgres:17
    container_name: gc_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: cakes
      POSTGRES_PASSWORD: local-cakes-only
      POSTGRES_DB: cakes
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakes -d cakes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Disposable test database for TEST_DATABASE_URL: docker compose --profile test up -d --wait postgres-test
  postgres-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: cakes
      POSTGRES_PASSWORD: local-cakes-only
      POSTGRES_DB: cakes_test
    ports:
      - "127.0.0.1:5436:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakes -d cakes_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev-data:
