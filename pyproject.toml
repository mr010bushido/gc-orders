[project]
name = "gc-orders"
version = "0.1.0"
description = "Online cake booking and order management for Giuseppe's Cakes"
readme = "README.md"
authors = [
    { name = "Mr010Bushido", email = "thadudejoss@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
